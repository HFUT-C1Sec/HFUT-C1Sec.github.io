  function makeNode(id, name, kind, stage, size, fill, border, bw, labelColor, labelSize, labelWeight, url){
    return {
      id: id, name: name, kind: kind, stage: stage, url: url || null,
      symbolSize: size,
      itemStyle: { color: fill, borderColor: border, borderWidth: bw },
      label: { color: labelColor, fontSize: labelSize, fontWeight: labelWeight }
    };
  }

  function buildGraph(){
    var nodes = [], links = [];
    childCount = {};
    nodes.push(makeNode('root', '安全工具', 'root', null, 36, '#FFFFFF', '#0e1624', 2, '#FFFFFF', 16, 700));

    KG_DATA.forEach(function(st){
      var sid = stageId(st.name);
      var rgb = stageColor(st.name);
      nodes.push(makeNode(sid, st.name, 'stage', st.name, 24, rgba(rgb,1), '#0e1624', 2, rgba(rgb,1), 14, 700));
      links.push({ source: 'root', target: sid });
      childCount[sid] = st.topics.length;

      st.topics.forEach(function(tp){
        var tid = topicId(st.name, tp.name);
        var isExp = !!expanded[tid];
        nodes.push(makeNode(tid, tp.name, 'topic', st.name, 13,
          rgba(rgb, isExp ? 0.8 : 0.45),
          isExp ? '#A9D4FF' : '#0e1624',
          isExp ? 2 : 1,
          rgba(rgb, 0.95), 12, 400));
        links.push({ source: sid, target: tid });
        childCount[tid] = tp.articles.length;

        if (isExp) {
          tp.articles.forEach(function(a){
            var aid = articleId(a.id);
            nodes.push(makeNode(aid, a.title, 'article', st.name, 7,
              'rgba(91,122,153,0.55)', '#0e1624', 1,
              '#B9C6D6', 10.5, 400,
              'https://xz.aliyun.com/picture-word?id=' + a.id));
            links.push({ source: tid, target: aid });
          });
        }
      });
    });

    nodes.forEach(function(n){
      if (highlight[n.id]) {
        n.itemStyle = {
          color: n.kind === 'article' ? 'rgba(255,214,102,0.92)' : '#FFD666',
          borderColor: '#FFD666', borderWidth: 2.5,
          shadowBlur: 18, shadowColor: 'rgba(255,214,102,0.85)'
        };
        n.label = { color: '#FFD666', fontSize: n.kind === 'article' ? 11 : 13, fontWeight: 600 };
      }
    });

    return { nodes: nodes, links: links };
  }

  function makeOption(nodes, links){

    return {
      backgroundColor: 'transparent',

        trigger: 'item',

        borderColor: '#2E4A66',
        textStyle: { color: '#E6EDF3', fontSize: 12 },
        confine: true,
        formatter: function(p){
          var d = p && p.data;
          if (!d || !d.name) return '';
          if (d.url) return '<b>' + esc(d.name) + '</b><br/><span style="color:#58A6FF;">点击打开词条 ↗</span>';
          var cnt = childCount[d.id];
          if (cnt) return '<b>' + esc(d.name) + '</b><br/>' + cnt + ' 个子项 · 点击展开/折叠';
          return '<b>' + esc(d.name) + '</b>';
        }
      },
      series: [{
        type: 'graph',
        layout: 'force',
        roam: true,
        draggable: true,
        data: nodes,
        links: links,
        label: { show: true, position: 'right', distance: 6 },
        labelLayout: { hideOverlap: true },
        lineStyle: { color: 'rgba(80,120,160,0.5)', width: 1, curveness: 0.08 },
        emphasis: { focus: 'adjacency', label: { fontWeight: 600 } },
        force: { repulsion: rep, edgeLength: [50, 120], gravity: 0.08, friction: 0.55, layoutAnimation: true },
        scaleLimit: { min: 0.15, max: 4 },
        animationDuration: 500,
        animationDurationUpdate: 500
      }]
    };
  }

  function render(){
    if (!chart) return;
    var g = buildGraph();
    chart.setOption(makeOption(g.nodes, g.links));
  }

  // ---- 交互 ----
  if (chart) {
    chart.on('click', function(p){
      var d = p && p.data;
      if (!d || !d.id) return;
      if (d.url) { window.open(d.url, '_blank'); return; }
      if (d.kind === 'topic') {
        expanded[d.id] = !expanded[d.id];
        render();
      } else if (d.kind === 'stage') {
        var anyCollapsed = false;
        KG_DATA.forEach(function(st){
          if (st.name !== d.stage) return;
          st.topics.forEach(function(tp){
            if (!expanded[topicId(st.name, tp.name)]) anyCollapsed = true;
          });
        });
        KG_DATA.forEach(function(st){
          if (st.name !== d.stage) return;
          st.topics.forEach(function(tp){ expanded[topicId(st.name, tp.name)] = anyCollapsed; });
        });
        render();
      }
    });
    window.addEventListener('resize', function(){ chart.resize(); });
    render();
  }

  // 搜索
  var searchEl = document.getElementById('search');
  var matchInfo = document.getElementById('matchInfo');
  var timer = null;
  function applySearch(q){
    highlight = {};
    var f = (q || '').trim().toLowerCase();
    var matched = 0;
    if (f) {
      KG_DATA.forEach(function(st){
        st.topics.forEach(function(tp){
          var tid = topicId(st.name, tp.name);
          var tHit = tp.name.toLowerCase().indexOf(f) >= 0;
          tp.articles.forEach(function(a){
            var aHit = a.title.toLowerCase().indexOf(f) >= 0;
            if (aHit) { highlight[articleId(a.id)] = true; expanded[tid] = true; matched++; }
          });
          if (tHit) { highlight[tid] = true; expanded[tid] = true; matched += tp.articles.length; }
        });
      });
    }
    matchInfo.textContent = f ? ('匹配 ' + matched + ' 个工具') : '';
    render();
  }
  searchEl.addEventListener('input', function(){
    clearTimeout(timer);
    var v = this.value;
    timer = setTimeout(function(){ applySearch(v); }, 250);
  });
  document.getElementById('btnExpand').addEventListener('click', function(){
    KG_DATA.forEach(function(st){
      st.topics.forEach(function(tp){ expanded[topicId(st.name, tp.name)] = true; });
    });
    searchEl.value = '';
    applySearch('');
  });
  document.getElementById('btnCollapse').addEventListener('click', function(){
    expanded = {};
    searchEl.value = '';
    applySearch('');
  });
})();
</script>
</body>
</html>
