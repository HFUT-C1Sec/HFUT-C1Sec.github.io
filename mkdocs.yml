# C1SEC 社团站点配置
# 官方文档: https://squidfunk.github.io/mkdocs-material/

site_name: C1SEC
# 仓库名为 <组织名>.github.io，Pages 站点位于组织根域名
site_url: https://hfut-c1sec.github.io/
repo_url: https://github.com/HFUT-C1Sec/HFUT-C1Sec.github.io
repo_name: HFUT-C1Sec/HFUT-C1Sec.github.io
edit_uri: edit/main/docs/   # 默认按 master 分支推导，本仓库是 main，不显式指定会 404

site_description: C1SEC 社团官方网站

theme:
  name: material
  logo: assets/c1sec-logo.jpg     # 页眉左上角 logo
  favicon: assets/c1sec-logo.jpg  # 浏览器标签页图标
  language: zh
  features:
    - navigation.tabs          # 顶部横向 tab
    - navigation.tabs.sticky   # 下滑时 tab 固定
    - navigation.indexes       # 点击 tab/文件夹标题可进入其 index 页
    - navigation.top
    - navigation.footer
    - navigation.instant
    - content.breadcrumbs      # 页面顶部面包屑
    - content.links.new_tab    # 外部链接自动在新标签页打开
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

nav:
  - About-Ours: index.md

  - 新生专享:  
      - freshman/index.md
      - 资源篇:
          - CTF 资源:
              - CTF 入门课程: resources/ctf/courses.md
              - CTF 赛事导航: resources/ctf/events.md
              - 综合题库与训练平台: resources/ctf/platforms.md
              - 专项训练平台: resources/ctf/specialized.md
              - 赛事与战队主办: resources/ctf/competitions.md
              - 国际综合平台: resources/ctf/international.md
          - 系统课程: resources/pentest/courses.md
          - 经典靶场（需动手搭建）: resources/pentest/labs.md
          - 漏洞集成与复现平台: resources/pentest/vuln-env.md
          - 综合实战与技能学习平台: resources/pentest/platforms.md
          - 证书: resources/certs.md
          - 漏洞挖掘平台: resources/bug-bounty.md
          - 计算机方向学习资源: resources/cs-learning.md
      - 基建篇:
          - 如何更好地使用电脑: infra/computer-basics.md
          - 向数字笔记转型: infra/digital-notes.md
          - Git 与 GitHub: infra/git-github.md
          - 基础环境搭建: infra/environment.md
          - 基础网络与计算机知识: infra/network-basics.md
          - 编程: infra/programming.md
          - GUI 与 CLI: infra/gui-cli.md
          - AI: infra/ai.md
          - 付费软件与资料: infra/paid-software.md
          - 科学上网: infra/science-online.md
      - 认知篇:
          - 学习本身:
              - cognition/learning/index.md
              - 主动学习与被动学习: cognition/learning/active-vs-passive.md
              - 应试化学习与社会化学习: cognition/learning/exam-vs-social.md
              - '辩证地看待"系统性学习"': cognition/learning/systematic-learning.md
          - 降低预期:
              - 过来人的建议: cognition/expectation/advice.md
              - 身边的卷王们: cognition/expectation/peers.md
              - 我还能做什么: cognition/expectation/what-can-i-do.md
          - 提问的艺术: cognition/asking-questions.md
          - HTB《Learning Process》:
              - cognition/htb/index.md
              - 思维方式: cognition/htb/mindset.md
              - 跳出思维定势: cognition/htb/outside-the-box.md
              - "奥卡姆剃刀（Occam's Razor）": cognition/htb/occams-razor.md
              - 天赋: cognition/htb/talent.md
              - 学习之道: cognition/htb/way-of-learning.md
              - 学习效率: cognition/htb/learning-efficiency.md
              - 学习类型: cognition/htb/learning-types.md
              - 大脑: cognition/htb/brain.md
              - 意志: cognition/htb/will.md
              - 目标: cognition/htb/goal.md
              - 决策: cognition/htb/decision-making.md
              - 文档: cognition/htb/documentation.md
              - 组织: cognition/htb/organization.md
              - 专注力: cognition/htb/focus.md
              - 注意力: cognition/htb/attention.md
              - 舒适: cognition/htb/comfort.md
              - 恐惧: cognition/htb/fear.md
              - 提问: cognition/htb/questioning.md
              - 应对挫败感: cognition/htb/frustration.md
              - 学习进度: cognition/htb/progress.md
      
      

  - 培训计划表:
      - training/index.md
      - 第 1 周: training/week-01.md

plugins:
  - search
  - tags

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

copyright: © 2026 C1SEC
