# C1SEC 社团站点配置
# 官方文档: https://squidfunk.github.io/mkdocs-material/

site_name: C1SEC
# 仓库名为 <组织名>.github.io，Pages 站点位于组织根域名
site_url: https://hfut-c1sec.github.io/
repo_url: https://github.com/HFUT-C1Sec/HFUT-C1Sec.github.io
repo_name: HFUT-C1Sec/HFUT-C1Sec.github.io
edit_uri: edit/main/docs/   # 默认按 master 分支推导，本仓库是 main，不显式指定会 404

site_description: C1SEC 社团官方网站

theme:
  name: material
  logo: assets/c1sec-logo.jpg     # 页眉左上角 logo
  favicon: assets/c1sec-logo.jpg  # 浏览器标签页图标
  language: zh
  features:
    - navigation.tabs          # 顶部横向 tab
    - navigation.tabs.sticky   # 下滑时 tab 固定
    - navigation.indexes       # 点击 tab/文件夹标题可进入其 index 页
    - navigation.top
    - navigation.footer
    - navigation.instant
    - content.breadcrumbs      # 页面顶部面包屑
    - content.links.new_tab    # 外部链接自动在新标签页打开
    - content.code.copy
    - content.tabs.link
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到浅色模式

